<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --app-bg: #0d1117;
    --app-header: #161b22;
    --app-surface: #161b22;
    --app-panel: #21262d;
    --app-primary: #3b82f6;
    --app-primary-hover: #2563eb;
    --app-light-primary: #1e3a8a;
    --app-incoming: #21262d;
    --app-text: #f0f6fc;
    --app-muted: #8b949e;
    --app-border: #30363d;
    --app-danger: #f85149;
  }
  *{ box-sizing:border-box; margin:0; padding:0; user-select: none; }
  html,body{ height:100%; overflow: hidden; }
  body{
    font-family:'Cairo', sans-serif;
    background: #010409;
    color: var(--app-text);
    display:flex; justify-content:center; align-items:center;
    min-height:100vh;
  }
  .shell{
    width:100%; max-width:480px; height:100vh; max-height:920px;
    background: var(--app-bg);
    display:flex; flex-direction:column;
    overflow:hidden;
    position:relative;
  }
  @media (min-width:550px){
    .shell{ border-radius:20px; height:94vh; box-shadow:0 25px 50px rgba(0,0,0,.8); border:1px solid var(--app-border); }
  }
  .screen{ display:none; flex-direction:column; height:100%; }
  .screen.active{ display:flex; }

  /* ---------- AUTH SCREEN ---------- */
  .auth-wrap{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding: 32px 28px; overflow-y:auto;
    background: radial-gradient(circle at top right, #1e3a8a 0%, #0d1117 60%);
    position: relative;
  }
  .auth-header-card { text-align: center; margin-bottom: 28px; }
  .auth-brand-icon {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    border-radius: 22px; display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4); margin-bottom: 16px;
  }
  .auth-brand-icon svg{ width: 40px; height: 40px; fill: #fff; }
  .auth-wrap h1{ font-size: 28px; font-weight: 900; color: #fff; margin-bottom: 6px; }
  .auth-wrap p.sub{ color: var(--app-muted); font-size: 14.5px; font-weight: 500; }
  .brand-title-blue { color: #60a5fa; font-weight: 900; }

  .auth-tabs{
    display:flex; width:100%; margin-bottom: 24px;
    background: rgba(33, 38, 45, 0.7); backdrop-filter: blur(10px);
    border-radius: 14px; padding: 5px; border: 1px solid rgba(255,255,255,0.05);
  }
  .auth-tab{
    flex:1; padding: 12px; background: transparent; border: none; border-radius: 10px;
    cursor: pointer; font-family: inherit; font-weight: 700; font-size: 14.5px; color: var(--app-muted);
    transition: all 0.3s;
  }
  .auth-tab.active{
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: #fff; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
  }

  .field{ margin-bottom: 18px; position: relative; }
  .field label { display:block; font-size: 13px; color: var(--app-muted); margin-bottom: 6px; font-weight: 700; }
  .field input{
    width: 100%; padding: 16px 18px;
    background: rgba(33, 38, 45, 0.8); backdrop-filter: blur(5px);
    border: 1.5px solid var(--app-border); border-radius: 14px;
    color: var(--app-text); font-family: inherit; font-size: 15px; outline: none;
    transition: all 0.3s ease;
  }
  .field input:focus{ border-color: var(--app-primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2); }

  .btn-primary{
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: #fff; border: none; border-radius: 14px;
    font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer;
    margin-top: 8px; box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
  }
  .auth-hint{ text-align: center; color: var(--app-muted); font-size: 13px; margin-top: 22px; font-weight: 500; }

  /* ---------- APP HEADER & CHATS LIST ---------- */
  .app-top-bar{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--app-header); border-bottom: 1px solid var(--app-border); }
  .app-top-bar h1{ font-size:20px; font-weight:800; color:var(--app-text); }
  .app-top-actions{ display:flex; gap:16px; align-items:center; }
  .app-icon-btn{ background:none; border:none; color:var(--app-muted); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; }

  .me-chip{ display:flex; align-items:center; padding:8px 16px; font-size:13px; color:var(--app-muted); background:var(--app-bg); border-bottom:1px solid var(--app-border); }

  .search-row{ display:flex; gap:10px; padding:10px 16px; background:var(--app-bg); }
  .search-row input{
    flex:1; padding:10px 14px; background:var(--app-panel); border:1px solid var(--app-border);
    border-radius:10px; color:var(--app-text); font-family:inherit; font-size:14px; outline:none;
  }
  .search-row button{
    padding:0 18px; background:var(--app-primary); color:#fff; border:none; border-radius:10px;
    font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;
  }

  .friends-scroll{ flex:1; overflow-y:auto; background:var(--app-bg); }
  .friend-row{ display:flex; align-items:center; gap:14px; padding:12px 16px; cursor:pointer; border-bottom:1px solid rgba(48,54,61,0.5); }
  .friend-row:hover{ background:var(--app-panel); }
  .avatar{
    width:48px; height:48px; border-radius:50%; background:#30363d;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px; color:#fff; flex-shrink:0;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .friend-meta{ flex:1; min-width:0; }
  .friend-meta .name{ font-weight:600; font-size:16px; margin-bottom:3px; color:var(--app-text); }
  .friend-meta .preview{ font-size:13.5px; color:var(--app-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty-note{ text-align:center; color:var(--app-muted); font-size:14px; padding:80px 30px; line-height:1.8; }

  /* ---------- SETTINGS SCREEN ---------- */
  .settings-wrap{ flex:1; overflow-y:auto; padding:20px; background:var(--app-bg); }

  /* ---------- CHAT SCREEN ---------- */
  .chat-top{ display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:var(--app-header); border-bottom:1px solid var(--app-border); }
  .chat-left-info{ display:flex; align-items:center; gap:10px; }
  .chat-top .avatar{ width:40px; height:40px; font-size:15px; }
  .chat-top .who h3{ font-size:16px; font-weight:600; color:var(--app-text); }
  .chat-top .who span{ font-size:12px; color:var(--app-muted); }
  .chat-actions{ display:flex; gap:18px; align-items:center; }
  .back-icon{ background:none; border:none; color:var(--app-muted); font-size:20px; cursor:pointer; padding:4px; display:flex; align-items:center; }

  .messages{ 
    flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; 
    background-color: #0d1117;
    background-image: radial-gradient(rgba(255,255,255,0.02) 1px, transparent 0);
    background-size: 24px 24px;
  }
  .bubble{ max-width:78%; padding:10px 14px; border-radius:12px; font-size:14.5px; line-height:1.45; word-wrap:break-word; position:relative; }
  .bubble.me{ align-self:flex-start; background: var(--app-light-primary); border-top-right-radius:0; color:#f0f6fc; border: 1px solid rgba(59, 130, 246, 0.3); }
  .bubble.them{ align-self:flex-end; background:var(--app-incoming); border-top-left-radius:0; color:#f0f6fc; border: 1px solid var(--app-border); }
  
  .bubble a { color: #60a5fa; text-decoration: underline; font-weight: bold; }

  .composer{ display:flex; gap:8px; padding:10px 16px; background:var(--app-header); align-items:center; border-top: 1px solid var(--app-border); }
  .composer input{
    flex:1; padding:11px 16px; border-radius:10px; background:var(--app-panel);
    border:1px solid var(--app-border); color:var(--app-text); font-family:inherit; font-size:14.5px; outline:none;
  }
  .composer button{
    width:42px; height:42px; border-radius:50%; background:var(--app-primary);
    color:#fff; border:none; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .composer button.recording {
    background: var(--app-danger);
    animation: pulseRec 1.2s infinite;
  }
  @keyframes pulseRec {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(248, 81, 73, 0.7); }
    70% { transform: scale(1.08); box-shadow: 0 0 0 8px rgba(248, 81, 73, 0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(248, 81, 73, 0); }
  }

  audio.voice-player { width: 200px; height: 36px; accent-color: var(--app-primary); }
</style>
</head>
<body>

<div class="shell">

  <!-- AUTH SCREEN -->
  <div id="screen-auth" class="screen active">
    <div class="auth-wrap">
      <div class="auth-header-card">
        <div class="auth-brand-icon">
          <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        </div>
        <h1>أهلاً بك في <span class="brand-title-blue">Message App</span></h1>
        <p class="sub">منصة التراسل الفوري الذكية</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchAuthMode('login')">تسجيل دخول</button>
        <button class="auth-tab" id="tabSignup" onclick="switchAuthMode('signup')">حساب جديد</button>
      </div>

      <div class="field">
        <label>اسم المستخدم</label>
        <input id="usernameInput" type="text" placeholder="أدخل اسمك هنا...">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input id="passwordInput" type="password" placeholder="••••••••">
      </div>

      <button class="btn-primary" id="authBtn">متابعة</button>
      <div class="auth-hint">بياناتك آمنة ومشفرة بالكامل 🔒</div>
    </div>
  </div>

  <!-- FRIENDS LIST -->
  <div id="screen-friends" class="screen">
    <div class="app-top-bar">
      <h1><span class="brand-title-blue">Message App</span></h1>
      <div class="app-top-actions">
        <button class="app-icon-btn" id="settingsNavBtn" title="الإعدادات">⚙️</button>
        <button class="app-icon-btn" id="logoutBtn" title="خروج">⏻</button>
      </div>
    </div>
    <div class="me-chip">
      <span>الحساب: <b id="meName" style="color:var(--app-text)"></b></span>
    </div>
    <div class="search-row">
      <input id="newFriendInput" type="text" placeholder="بحث أو بدء محادثة جديدة...">
      <button id="startChatBtn">إضافة</button>
    </div>
    <div class="friends-scroll" id="friendsScroll">
      <div class="empty-note">لا توجد محادثات حالياً.<br>أدخل اسم صديقك في الأعلى لبدء الدردشة.</div>
    </div>
  </div>

  <!-- SETTINGS SCREEN -->
  <div id="screen-settings" class="screen">
    <div class="app-top-bar">
      <div class="chat-left-info">
        <button class="back-icon" id="settingsBackBtn">✕</button>
        <h1 style="font-size:18px;">الإعدادات والحساب</h1>
      </div>
    </div>
    <div class="settings-wrap">
      <div style="background:var(--app-panel); border-radius:12px; padding:16px; border: 1px solid var(--app-border);">
        <h4 style="margin-bottom:14px; font-size:15px; color:var(--app-text);">تعديل بيانات الحساب</h4>
        <div class="field" style="margin-bottom:12px;">
          <label>اسم المستخدم الجديد</label>
          <input id="editUsernameInput" type="text" style="padding:12px 14px;">
        </div>
        <div class="field" style="margin-bottom:16px;">
          <label>كلمة المرور الجديدة</label>
          <input id="editPasswordInput" type="password" placeholder="اتركها فارغة إذا لم ترد التغيير" style="padding:12px 14px;">
        </div>
        <button class="btn-primary" id="saveProfileBtn">حفظ التعديلات</button>
      </div>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="screen-chat" class="screen">
    <div class="chat-top">
      <div class="chat-left-info">
        <button class="back-icon" id="backBtn">←</button>
        <div class="avatar" id="chatAvatar">?</div>
        <div class="who">
          <h3 id="chatName"></h3>
          <span>متصل الآن</span>
        </div>
      </div>
      <div class="chat-actions">
        <button class="app-icon-btn" id="videoCallBtn" title="إرسال رابط مكالمة فيديو">📹</button>
        <button class="app-icon-btn" id="audioCallBtn" title="إرسال رابط مكالمة صوتية">📞</button>
      </div>
    </div>

    <div class="messages" id="messagesEl"></div>
    <div class="composer">
      <input id="msgInput" type="text" placeholder="اكتب رسالة...">
      <button id="sendBtn" title="إرسال نص">➤</button>
      <button id="voiceBtn" title="تسجيل صوتي">🎙️</button>
    </div>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://roqpinipcgwqeqqfpcjm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BHglXdT_SHbruwO_mluYOQ_DG6twygK';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUsername = '';
let currentReceiver = '';
let friends = [];
let isSignUp = false;

window.addEventListener('DOMContentLoaded', () => {
  const savedUser = localStorage.getItem('chat_current_user');
  if (savedUser) {
    currentUsername = savedUser;
    document.getElementById('meName').innerText = currentUsername;
    showScreen('screen-friends');
    loadExistingChats();
    subscribeToRealtime();
  }
});

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function initials(name){
  return (name || '?').trim().charAt(0).toUpperCase();
}

function switchAuthMode(mode) {
  isSignUp = (mode === 'signup');
  const btn = document.getElementById('authBtn');
  const tabLogin = document.getElementById('tabLogin');
  const tabSignup = document.getElementById('tabSignup');

  if (isSignUp) {
    document.getElementById('screen-auth').querySelector('h1').innerHTML = 'حساب جديد في <span class="brand-title-blue">Message App</span>';
    btn.innerText = 'إنشاء الحساب';
    tabSignup.classList.add('active');
    tabLogin.classList.remove('active');
  } else {
    document.getElementById('screen-auth').querySelector('h1').innerHTML = 'أهلاً بك في <span class="brand-title-blue">Message App</span>';
    btn.innerText = 'متابعة';
    tabLogin.classList.add('active');
    tabSignup.classList.remove('active');
  }
}

document.getElementById('authBtn').onclick = async () => {
  const username = document.getElementById('usernameInput').value.trim();
  const password = document.getElementById('passwordInput').value.trim();

  if (!username || !password) {
    alert('الرجاء إدخال اسم المستخدم وكلمة المرور');
    return;
  }

  if (isSignUp) {
    const { data: existing } = await supabaseClient
      .from('profiles').select('username').eq('username', username).single();

    if (existing) {
      alert('اسم المستخدم موجود مسبقاً.');
      return;
    }

    const { error } = await supabaseClient.from('profiles').insert([{ username, password }]);
    if (error) { alert('خطأ: ' + error.message); return; }
    loginSuccess(username);
  } else {
    const { data, error } = await supabaseClient
      .from('profiles').select('*').eq('username', username).eq('password', password).single();

    if (error || !data) {
      alert('اسم المستخدم أو كلمة المرور غير صحيحة!');
      return;
    }
    loginSuccess(username);
  }
};

function loginSuccess(username) {
  currentUsername = username;
  localStorage.setItem('chat_current_user', username);
  document.getElementById('meName').innerText = currentUsername;
  showScreen('screen-friends');
  loadExistingChats();
  subscribeToRealtime();
}

document.getElementById('logoutBtn').onclick = () => {
  localStorage.removeItem('chat_current_user');
  currentUsername = '';
  friends = [];
  showScreen('screen-auth');
};

document.getElementById('settingsNavBtn').onclick = () => {
  document.getElementById('editUsernameInput').value = currentUsername;
  document.getElementById('editPasswordInput').value = '';
  showScreen('screen-settings');
};

document.getElementById('settingsBackBtn').onclick = () => showScreen('screen-friends');

document.getElementById('saveProfileBtn').onclick = async () => {
  const newName = document.getElementById('editUsernameInput').value.trim();
  const newPass = document.getElementById('editPasswordInput').value.trim();
  if (!newName) { alert('اسم المستخدم مطلوب'); return; }

  const updateData = { username: newName };
  if (newPass) updateData.password = newPass;

  const { error } = await supabaseClient.from('profiles').update(updateData).eq('username', currentUsername);
  if (error) { alert('خطأ: ' + error.message); return; }

  currentUsername = newName;
  localStorage.setItem('chat_current_user', currentUsername);
  document.getElementById('meName').innerText = currentUsername;
  alert('تم الحفظ بنجاح!');
  showScreen('screen-friends');
};

document.getElementById('startChatBtn').onclick = () => {
  const name = document.getElementById('newFriendInput').value.trim();
  if(!name || name === currentUsername){ alert('الرجاء إدخال اسم صحيح'); return; }
  if(!friends.includes(name)) friends.push(name);
  document.getElementById('newFriendInput').value = '';
  openChat(name);
};

async function loadExistingChats(){
  const { data, error } = await supabaseClient
    .from('message').select('sender, receiver').or(`sender.eq.${currentUsername},receiver.eq.${currentUsername}`);

  if(!error && data){
    data.forEach(m => {
      const other = m.sender === currentUsername ? m.receiver : m.sender;
      if(other && !friends.includes(other)) friends.push(other);
    });
    renderFriends();
  }
}

function renderFriends(){
  const el = document.getElementById('friendsScroll');
  el.innerHTML = '';
  if(friends.length === 0){
    el.innerHTML = '<div class="empty-note">لا توجد محادثات حالياً.<br>أدخل اسم صديقك في الأعلى لبدء الدردشة.</div>';
    return;
  }
  friends.forEach(f => {
    const row = document.createElement('div');
    row.className = 'friend-row';
    row.innerHTML = `<div class="avatar">${initials(f)}</div><div class="friend-meta"><div class="name">${f}</div><div class="preview">انقر لفتح المحادثة</div></div>`;
    row.onclick = () => openChat(f);
    el.appendChild(row);
  });
}

function openChat(friend){
  currentReceiver = friend;
  document.getElementById('chatName').innerText = friend;
  document.getElementById('chatAvatar').innerText = initials(friend);
  showScreen('screen-chat');
  loadMessages();
}

document.getElementById('backBtn').onclick = () => {
  currentReceiver = '';
  showScreen('screen-friends');
  loadExistingChats();
};

async function sendMessage(textToSend = null, audioUrlToSend = null){
  const input = document.getElementById('msgInput');
  const text = textToSend !== null ? textToSend : input.value.trim();
  if(!text && !audioUrlToSend) return;
  if(textToSend === null) input.value = '';

  const payload = { sender: currentUsername, receiver: currentReceiver, text: text || '', audio_url: audioUrlToSend || null };
  await supabaseClient.from('message').insert([payload]);
}

document.getElementById('sendBtn').onclick = () => sendMessage();
document.getElementById('msgInput').addEventListener('keypress', e => { if(e.key === 'Enter') sendMessage(); });

/* Voice Message */
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

document.getElementById('voiceBtn').onclick = async () => {
  const btn = document.getElementById('voiceBtn');
  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.readAsDataURL(audioBlob);
        reader.onloadend = async () => { await sendMessage('🎤 [مقطع صوتي]', reader.result); };
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      isRecording = true;
      btn.classList.add('recording');
    } catch (e) {
      alert('تعذر الوصول للمايكروفون: ' + e.message);
    }
  } else {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    isRecording = false;
    btn.classList.remove('recording');
  }
};

async function loadMessages(){
  const { data, error } = await supabaseClient
    .from('message').select('*')
    .or(`and(sender.eq.${currentUsername},receiver.eq.${currentReceiver}),and(sender.eq.${currentReceiver},receiver.eq.${currentUsername})`)
    .order('created_at', { ascending: true });

  const box = document.getElementById('messagesEl');
  box.innerHTML = '';
  if(!error && data) data.forEach(appendMessage);
}

function appendMessage(msg){
  const relevant = (msg.sender === currentUsername && msg.receiver === currentReceiver) || (msg.sender === currentReceiver && msg.receiver === currentUsername);
  if(!relevant) return;

  const box = document.getElementById('messagesEl');
  const div = document.createElement('div');
  div.className = 'bubble ' + (msg.sender === currentUsername ? 'me' : 'them');

  if(msg.audio_url){
    div.innerHTML = `<div style="font-size:12px; margin-bottom:4px; opacity:0.8;">🎤 رسالة صوتية</div><audio controls class="voice-player" src="${msg.audio_url}"></audio>`;
  } else {
    // التحقق إذا كان النص يحتوي على رابط ويب لعرضه بشكل قابل للنقر
    let formattedText = msg.text;
    if (formattedText.startsWith('http://') || formattedText.startsWith('https://')) {
      formattedText = `<a href="${formattedText}" target="_blank">🔗 اضغط هنا للانضمام للمكالمة</a>`;
    }
    div.innerHTML = formattedText;
  }
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function subscribeToRealtime(){
  supabaseClient.channel('public:message')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'message' }, payload => {
      appendMessage(payload.new);
    }).subscribe();
}

// إرسال رابط مكالمة (فيديو أو صوت)
function sendCallLink(isVideo) {
  const roomCode = Math.random().toString(36.25).substring(2, 9);
  const callUrl = `https://meet.jit.si/MessageApp_${roomCode}`;
  const callType = isVideo ? '📹 رابط مكالمة فيديو:' : '📞 رابط مكالمة صوتية:';
  
  sendMessage(`${callType}\n${callUrl}`);
  window.open(callUrl, '_blank');
}

document.getElementById('videoCallBtn').onclick = () => { if(currentReceiver) sendCallLink(true); };
document.getElementById('audioCallBtn').onclick = () => { if(currentReceiver) sendCallLink(false); };
</script>
