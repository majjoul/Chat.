let pushRegistration = null;


async function registerPushServiceWorker(){

  if(
    !("serviceWorker" in navigator)
  ){

    console.warn(
      "Service Worker غير مدعوم."
    );

    return null;
  }


  try{

    pushRegistration =
      await navigator
        .serviceWorker
        .register(
          "./sw.js",
          {
            scope: "./"
          }
        );


    console.log(
      "Service Worker registered:",
      pushRegistration
    );


    /*
     * انتظار أن يصبح Service Worker جاهزًا
     */

    await navigator
      .serviceWorker
      .ready;


    console.log(
      "Service Worker is ready."
    );


    return pushRegistration;


  }catch(error){

    console.error(
      "Service Worker registration error:",
      error
    );

    return null;
  }

}

/* =========================================================
   RINGTONE SYSTEM
   ========================================================= */

function startRingtone(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if(!AudioContext)
      return;


    const ctx =
      new AudioContext();


    ringInterval =
      setInterval(
        () => {

          if(
            ctx.state ===
            "suspended"
          ){

            ctx.resume();

          }


          const osc =
            ctx.createOscillator();


          const gain =
            ctx.createGain();


          osc.type =
            "sine";


          osc.frequency.setValueAtTime(
            440,
            ctx.currentTime
          );


          osc.frequency.setValueAtTime(
            480,
            ctx.currentTime + 0.2
          );


          gain.gain.setValueAtTime(
            0.1,
            ctx.currentTime
          );


          gain.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + 0.4
          );


          osc.connect(gain);

          gain.connect(
            ctx.destination
          );


          osc.start();

          osc.stop(
            ctx.currentTime + 0.4
          );


        },
        1000
      );


  }catch(e){

    console.log(
      "Ringtone error:",
      e
    );

  }

}


function stopRingtone(){

  if(ringInterval){

    clearInterval(
      ringInterval
    );

    ringInterval =
      null;

  }

}

async function loadFriends(){

  if(!me)
    return;


  const {
    data,
    error
  } =
    await db
      .from("message")
      .select(
        "sender,receiver"
      )
      .or(
        `sender.eq.${me},receiver.eq.${me}`
      );


  if(error){

    console.error(error);

    return;

  }


  friends = [];


  (
    data || []
  ).forEach(
    message => {

      const other =
        message.sender === me
          ? message.receiver
          : message.sender;


      if(
        other &&
        other !== me &&
        !friends.includes(other)
      ){

        friends.push(
          other
        );

      }

    }
  );


  renderFriends();

}

      row.innerHTML = `

            ${escapeHtml(name)}

          </div>

      row.onclick =

      list.appendChild(

      );

    }
  );

}


function escapeHtml(value){

  return String(
    value || ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}

function renderMessage(message){

  const box =
    document.createElement(

  box.className =

    );


  $("messages")
    .scrollTop =
    $("messages")
      .scrollHeight;

}

/* =========================================================

function subscribeMessages(){

  if(!me)
    return;


  if(messageChannel){

    try{

      db.removeChannel(
        messageChannel
      );

    }catch(e){}

  }


  messageChannel =
    db
      .channel(
        "messages-" +
        me +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {

          event:
            "INSERT",

          schema:
            "public",

          table:
            "message"

        },

        payload => {

          const message =
            payload.new;


          const related =
            (
              message.sender === me &&
              message.receiver ===
                currentFriend
            ) ||
            (
              message.sender ===
                currentFriend &&
              message.receiver ===
                me
            );


          if(related){

            renderMessage(
              message
            );

          }


          loadFriends();

        }

      )
      .subscribe();

}

$("recordBtn").onclick =

    if(recording){

async function startRecording(){

  try{

    if(!currentFriend){

      alert(
        "افتح محادثة أولاً."
      );

      return;

    }


    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:
            true
        });


    recordingChunks = [];


    mediaRecorder =
      new MediaRecorder(
        stream
      );


    mediaRecorder
      .ondataavailable =
      event => {

        if(event.data.size){

          recordingChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      async () => {

        const blob =
          new Blob(
            recordingChunks,
            {
              type:
                "audio/webm"
            }
          );


        const reader =
          new FileReader();


        reader.onloadend =
          async () => {

            const {
              error
            } =
              await db
                .from("message")
                .insert([{

                  sender:
                    me,

                  receiver:
                    currentFriend,

                  text:
                    "🎙️ رسالة صوتية",

                  audio_url:
                    reader.result

                }]);


            if(error){

              console.error(
                error
              );


              alert(
                "تعذر إرسال الرسالة الصوتية."
              );

            }

          };


        reader.readAsDataURL(
          blob
        );


        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

      };


    mediaRecorder.start();


    recording =
      true;


    $("recordBtn")
      .classList
      .add(
        "recording"
      );


  }catch(error){

    console.error(error);


    alert(
      "تعذر الوصول إلى المايكروفون:\n" +
      error.message
    );

  }

}


function stopRecording(){

  if(
    mediaRecorder &&
    mediaRecorder.state !==
      "inactive"
  ){

    mediaRecorder.stop();

  }


  recording =
    false;


  $("recordBtn")
    .classList
    .remove(
      "recording"
    );

}

/* =========================================================
   CALL SIGNALING
   ========================================================= */

async function sendCallSignal(
  target,
  type,
  data,
  room = activeCallId
){

  if(
    !target ||
    !me ||
    !room
  ){

    return;

  }


  const payload = {

    ...data,

    from:
      me,

    to:
      target,

    callId:
      room

  };


  const { error } =
    await db
      .from("call_signals")
      .insert({

        room_id:
          room,

        sender_id:
          me,

        signal_type:
          type,

        payload:
          payload

      });


  if(error){

    console.error(
      "CALL SIGNAL ERROR:",
      error
    );

    throw error;

  }

}


/* =========================================================
   SUBSCRIBE CALL SIGNALS
   ========================================================= */

function subscribeCalls(){

  if(!me)
    return;


  if(callChannel){

    try{

      db.removeChannel(
        callChannel
      );

    }catch(e){}


    callChannel =
      null;

  }


  callChannel =
    db
      .channel(
        "call-signals-" +
        me +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {

          event:
            "INSERT",

          schema:
            "public",

          table:
            "call_signals"

        },

        async payload => {

          try{

            const row =
              payload.new;


            if(!row)
              return;


            const signal =
              row.payload ||
              {};


            if(
              signal.to !== me
            ){

              return;

            }


            if(
              row.sender_id === me
            ){

              return;

            }


            await handleCallSignal(
              row
            );


          }catch(error){

            console.error(
              "Signal handling error:",
              error
            );

          }

        }

      )
      .subscribe(
        status => {

          console.log(
            "Call signaling:",
            status
          );

        }
      );

}


/* =========================================================
   HANDLE CALL SIGNAL
   ========================================================= */

async function handleCallSignal(row){

  const type =
    row.signal_type;


  const data =
    row.payload ||
    {};


  switch(type){

    case "call":

      await receiveIncomingCall(
        data
      );

      break;


    case "answer":

      await receiveAnswer(
        data
      );

      break;


    case "ice":

      await receiveIce(
        data
      );

      break;


    case "hangup":

      await receiveHangup(
        data
      );

      break;


    case "declined":

      await receiveDeclined(
        data
      );

      break;


    case "busy":

      await receiveBusy(
        data
      );

      break;

  }

}


/* =========================================================
   INCOMING CALL
   ========================================================= */

async function receiveIncomingCall(data){

  if(!data.callId)
    return;


  if(
    activeCallUser ||
    pc ||
    incomingCaller
  ){

    try{

      await sendCallSignal(
        data.from,
        "busy",
        {
          callId:
            data.callId
        },
        data.callId
      );

    }catch(error){

      console.error(
        error
      );

    }


    return;

  }


  incomingCaller =
    data.from;


  incomingCallId =
    data.callId;


  incomingOffer =
    data.offer;


  incomingVideo =
    !!data.video;


  startRingtone();


  $("incomingAvatar")
    .textContent =
    initials(
      incomingCaller
    );


  $("incomingName")
    .textContent =
    incomingCaller;


  $("incomingType")
    .textContent =
      incomingVideo
        ? "📹 مكالمة فيديو واردة"
        : "📞 مكالمة صوتية واردة";


  $("incoming")
    .classList
    .add("show");

}


/* =========================================================
   START CALL
   ========================================================= */

$("audioCall").onclick =
  () =>
    startCall(false);


$("videoCall").onclick =
  () =>
    startCall(true);


async function startCall(video){

  if(!currentFriend)
    return;


  if(
    activeCallUser ||
    pc
  ){

    alert(
      "لديك مكالمة نشطة بالفعل."
    );

    return;

  }


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    alert(
      "الكاميرا والمايكروفون يحتاجان إلى HTTPS."
    );

    return;

  }


  activeCallUser =
    currentFriend;


  activeCallId =
    callId();


  muted =
    false;


  cameraOff =
    false;


  pendingIce =
    [];


  showCall();


  $("callTitle")
    .textContent =
      video
        ? "مكالمة فيديو مع " +
          activeCallUser
        : "مكالمة صوتية مع " +
          activeCallUser;


  setCallStatus(
    "جاري تشغيل الكاميرا والمايكروفون..."
  );


  try{

    localStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:
            true,

          video:
            video

        });


    createPeerConnection(
      activeCallUser,
      activeCallId
    );


    setupCallVideos(
      localStream,
      video
    );


    const offer =
      await pc.createOffer();


    await pc.setLocalDescription(
      offer
    );


    await sendCallSignal(
      activeCallUser,
      "call",
      {

        callId:
          activeCallId,

        video:
          video,

        offer:
          offer

      },
      activeCallId
    );


    setCallStatus(
      "في انتظار قبول المكالمة..."
    );


  }catch(error){

    console.error(
      error
    );


    alert(
      "تعذر بدء المكالمة:\n" +
      error.message
    );


    await endCall(
      false
    );

  }

}


/* =========================================================
   ACCEPT INCOMING CALL
   ========================================================= */

$("acceptCall").onclick =
  acceptIncoming;


async function acceptIncoming(){

  stopRingtone();


  $("incoming")
    .classList
    .remove("show");


  if(
    !incomingCaller ||
    !incomingCallId ||
    !incomingOffer
  ){

    clearIncoming();

    return;

  }


  const caller =
    incomingCaller;


  const id =
    incomingCallId;


  const offer =
    incomingOffer;


  const video =
    incomingVideo;


  activeCallUser =
    caller;


  activeCallId =
    id;


  clearIncoming();


  pendingIce =
    [];


  showCall();


  $("callTitle")
    .textContent =
      video
        ? "مكالمة فيديو مع " +
          caller
        : "مكالمة صوتية مع " +
          caller;


  setCallStatus(
    "جاري تشغيل الكاميرا والمايكروفون..."
  );


  try{

    localStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:
            true,

          video:
            video

        });


    createPeerConnection(
      caller,
      id
    );


    setupCallVideos(
      localStream,
      video
    );


    await pc.setRemoteDescription(
      new RTCSessionDescription(
        offer
      )
    );


    await flushIce();


    const answer =
      await pc.createAnswer();


    await pc.setLocalDescription(
      answer
    );


    await sendCallSignal(
      caller,
      "answer",
      {

        callId:
          id,

        answer:
          pc.localDescription

      },
      id
    );


    setCallStatus(
      "جاري الاتصال..."
    );


  }catch(error){

    console.error(
      error
    );


    try{

      await sendCallSignal(
        caller,
        "declined",
        {
          callId:
            id
        },
        id
      );

    }catch(e){

      console.error(
        e
      );

    }


    alert(
      "تعذر قبول المكالمة:\n" +
      error.message
    );


    await endCall(
      false
    );

  }

}

/* =========================================================
   CLEAR INCOMING
   ========================================================= */

function clearIncoming(){

  incomingCallId =
    "";


  incomingOffer =
    null;

    false;

}


/* =========================================================
   RECEIVE ANSWER
   ========================================================= */

async function receiveAnswer(data){

  if(!pc)
    return;


  if(!activeCallId)
    return;


  if(
    data.callId !==
    activeCallId
  )
    return;


  if(!data.answer)
    return;


  try{

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        data.answer
      )
    );


    await flushIce();


    setCallStatus(
      "متصل الآن"
    );


  }catch(error){

    console.error(
      "Answer error:",
      error
    );


    setCallStatus(
      "فشل استقبال الرد"
    );

  }

}


/* =========================================================
   RECEIVE ICE
   ========================================================= */

async function receiveIce(data){

  if(
    !data ||
    !data.candidate
  )
    return;


  const signalCallId =
    data.callId;


  if(!signalCallId)
    return;


  if(
    signalCallId !==
      activeCallId &&
    signalCallId !==
      incomingCallId
  ){

    return;

  }


  if(!pc){

    pendingIce.push(
      data.candidate
    );

    return;

  }


  if(
    !pc.remoteDescription ||
    !pc.remoteDescription.type
  ){

    pendingIce.push(
      data.candidate
    );

    return;

  }


  try{

    await pc.addIceCandidate(
      new RTCIceCandidate(
        data.candidate
      )
    );

  }catch(error){

    console.error(
      "ICE add error:",
      error
    );

  }

}


/* =========================================================
   RECEIVE HANGUP
   ========================================================= */

async function receiveHangup(data){

  if(
    data.callId !==
      activeCallId &&
    data.callId !==
      incomingCallId
  ){

    return;

  }


  await endCall(
    false
  );

}


/* =========================================================
   RECEIVE DECLINED
   ========================================================= */

async function receiveDeclined(data){

  if(
    data.callId !==
    activeCallId
  ){

    return;

  }


  alert(
    "تم رفض المكالمة."
  );


  await endCall(
    false
  );

}


/* =========================================================

async function receiveBusy(data){

  ){

  );

  );

}


/* =========================================================
   PEER CONNECTION
   ========================================================= */

function createPeerConnection(
  friend,
  id
){

  if(pc){

    try{

      pc.close();

    }catch(e){}

  }


  pc =
    new RTCPeerConnection(
      RTC_CONFIG
    );


  remoteStream =
    new MediaStream();


  pc.ontrack =
    event => {

      if(
        event.streams &&
        event.streams[0]
      ){

        event.streams[0]
          .getTracks()
          .forEach(
            track => {

              if(
                !remoteStream
                  .getTracks()
                  .includes(
                    track
                  )
              ){

                remoteStream.addTrack(
                  track
                );

              }

            }
          );

      }else{

        if(
          !remoteStream
            .getTracks()
            .includes(
              event.track
            )
        ){

          remoteStream.addTrack(
            event.track
          );

        }

      }


      const remote =
        document.querySelector(
          ".remote"
        );


      if(remote){

        remote.srcObject =
          remoteStream;


        remote.play()
          .catch(
            error => {

              console.warn(
                "Remote play:",
                error
              );

            }
          );

      }

    };


  pc.onicecandidate =
    async event => {

      if(
        !event.candidate
      ){

        return;

      }


      try{

        const candidate =
          event.candidate.toJSON
            ? event.candidate.toJSON()
            : {

                candidate:
                  event.candidate.candidate,

                sdpMid:
                  event.candidate.sdpMid,

                sdpMLineIndex:
                  event.candidate.sdpMLineIndex,

                usernameFragment:
                  event.candidate.usernameFragment

              };


        await sendCallSignal(
          friend,
          "ice",
          {

            callId:
              id,

            candidate:
              candidate

          },
          id
        );


      }catch(error){

        console.error(
          "ICE send error:",
          error
        );

      }

    };


  pc.onconnectionstatechange =
    () => {

      if(!pc)
        return;


      const state =
        pc.connectionState;


      if(
        state ===
        "connected"
      ){

        setCallStatus(
          "متصل الآن"
        );

      }
      else if(
        state ===
        "connecting"
      ){

        setCallStatus(
          "جاري الاتصال..."
        );

      }
      else if(
        state ===
        "disconnected"
      ){

        setCallStatus(
          "الاتصال انقطع..."
        );

      }
      else if(
        state ===
        "failed"
      ){

        setCallStatus(
          "فشل الاتصال"
        );

      }
      else if(
        state ===
        "closed"
      ){

        setCallStatus(
          "انتهت المكالمة"
        );

      }

    };


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track => {

          pc.addTrack(
            track,
            localStream
          );

        }
      );

  }

}


/* =========================================================
   FLUSH ICE
   ========================================================= */

async function flushIce(){

  if(!pc)
    return;


  if(
    !pc.remoteDescription ||
    !pc.remoteDescription.type
  ){

    return;

  }


  if(!pendingIce.length)
    return;


  const list =
    [...pendingIce];


  pendingIce =
    [];


  for(
    const candidate of list
  ){

    try{

      await pc.addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

    }catch(error){

      console.warn(
        "Queued ICE error:",
        error
      );

    }

  }

}


/* =========================================================
   CALL UI
   ========================================================= */

function setupCallVideos(
  stream,
  video
){

  const stage =
    $("callStage");


  stage.innerHTML =
    "";


  const remote =
    document.createElement(
      "video"
    );


  remote.className =
    "remote";


  remote.autoplay =
    true;


  remote.playsInline =
    true;


  remote.setAttribute(
    "playsinline",
    ""
  );


  const local =
    document.createElement(
      "video"
    );


  local.className =
    "local";


  local.autoplay =
    true;


  local.playsInline =
    true;


  local.muted =
    true;


  local.setAttribute(
    "playsinline",
    ""
  );


  local.srcObject =
    stream;


  if(!video){

    local.style.display =
      "none";


    const label =
      document.createElement(
        "div"
      );


    label.className =
      "audio-label";


    label.textContent =
      "📞 مكالمة صوتية";


    stage.appendChild(
      label
    );

  }


  stage.appendChild(
    remote
  );


  stage.appendChild(
    local
  );


  local.play()
    .catch(
      () => {}
    );

}


/* =========================================================
   MUTE
   ========================================================= */

$("muteBtn").onclick =
  () => {

    if(!localStream)
      return;


    const tracks =
      localStream
        .getAudioTracks();


    if(!tracks.length)
      return;


    muted =
      !muted;


    tracks.forEach(
      track => {

        track.enabled =
          !muted;

      }
    );


    $("muteBtn")
      .textContent =
      muted
        ? "🔇"
        : "🎤";

  };


/* =========================================================
   CAMERA
   ========================================================= */

$("cameraBtn").onclick =
  () => {

    if(!localStream)
      return;


    const tracks =
      localStream
        .getVideoTracks();


    if(!tracks.length)
      return;


    cameraOff =
      !cameraOff;


    tracks.forEach(
      track => {

        track.enabled =
          !cameraOff;

      }
    );


    $("cameraBtn")
      .textContent =
      cameraOff
        ? "🚫"
        : "📹";

  };


/* =========================================================
   HANGUP
   ========================================================= */

$("hangupBtn").onclick =
  () =>
    endCall(true);


async function endCall(
  sendSignalToOther
){

  stopRingtone();


  const user =
    activeCallUser;


  const id =
    activeCallId;


  if(
    sendSignalToOther &&
    user &&
    id
  ){

    try{

      await sendCallSignal(
        user,
        "hangup",
        {

          callId:
            id

        },
        id
      );

    }catch(error){

      console.error(
        "Hangup signal error:",
        error
      );

    }

  }


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    localStream =
      null;

  }


  if(pc){

    try{

      pc.ontrack =
        null;


      pc.onicecandidate =
        null;


      pc.onconnectionstatechange =
        null;


      pc.close();

    }catch(e){}


    pc =
      null;

  }


  remoteStream =
    null;


  pendingIce =
    [];


  activeCallUser =
    "";


  activeCallId =
    "";


  muted =
    false;


  cameraOff =
    false;


  $("callStage")
    .innerHTML =
    "";


  hideCall();

}

   PAGE CLOSE

window.addEventListener(
  "beforeunload",
  () => {

    if(localStream){

      localStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    if(pc){

      try{

        pc.close();

      }catch(e){}

    }

  }
);

){

  navigator.serviceWorker.addEventListener(

      const data =
        event.data || {};


      console.log(
        "Message from Service Worker:",
        data
      );


      /*

        );

      }

    }
  );

}
