<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Message App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{

  font-family:
    Arial,
    Tahoma,
    sans-serif;

  background:#080b10;
  color:#fff;

}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.app{

  width:100%;
  max-width:500px;
  height:100vh;

  margin:auto;

  background:#0d1117;

  position:relative;
  overflow:hidden;

}

.screen{

  display:none;

  width:100%;
  height:100%;

  flex-direction:column;

}

.screen.active{
  display:flex;
}


/* =========================================================
   LOGIN
   ========================================================= */

.auth{

  height:100%;
  overflow:auto;

  padding:35px 25px;

  display:flex;
  flex-direction:column;
  justify-content:center;

  background:
    radial-gradient(
      circle at top right,
      #17366e,
      transparent 45%
    ),
    #0d1117;

}

.logo{

  width:75px;
  height:75px;

  margin:
    0 auto 18px;

  border-radius:22px;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#2563eb;

  font-size:38px;

  box-shadow:
    0 10px 35px #2563eb55;

}

.auth h1{

  text-align:center;

  margin:
    0 0 8px;

  font-size:27px;

}

.auth p{

  text-align:center;

  color:#8b949e;

  margin:
    0 0 30px;

}

.tabs{

  display:flex;

  gap:5px;

  background:#161b22;

  padding:5px;

  border-radius:12px;

  margin-bottom:22px;

}

.tabs button{

  flex:1;

  border:0;

  padding:12px;

  border-radius:9px;

  background:transparent;

  color:#8b949e;

}

.tabs button.active{

  background:#2563eb;

  color:white;

}

label{

  display:block;

  color:#8b949e;

  font-size:13px;

  margin-bottom:7px;

}

input{

  width:100%;

  padding:14px;

  border-radius:11px;

  border:1px solid #30363d;

  background:#161b22;

  color:white;

  outline:none;

}

input:focus{
  border-color:#2563eb;
}

.field{
  margin-bottom:16px;
}

.primary{

  width:100%;

  padding:14px;

  border:0;

  border-radius:11px;

  color:white;

  background:#2563eb;

  font-size:16px;

  font-weight:bold;

}


/* =========================================================
   HEADER
   ========================================================= */

.header{

  height:62px;

  flex-shrink:0;

  background:#161b22;

  border-bottom:
    1px solid #30363d;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 15px;

}

.header h2{

  font-size:19px;
  margin:0;

}

.header button{

  background:none;

  border:0;

  color:white;

  font-size:20px;

}

.actions{

  display:flex;

  gap:15px;

}


/* =========================================================
   FRIENDS
   ========================================================= */

.account{

  padding:9px 15px;

  color:#8b949e;

  border-bottom:
    1px solid #30363d;

}

.account b{
  color:white;
}

.search{

  display:flex;

  gap:8px;

  padding:10px;

}

.search button{

  border:0;

  border-radius:10px;

  padding:0 17px;

  color:white;

  background:#2563eb;

}

.list{

  flex:1;

  overflow:auto;

}

.friend{

  display:flex;

  align-items:center;

  gap:12px;

  padding:13px 15px;

  border-bottom:
    1px solid #30363d66;

  cursor:pointer;

}

.friend:hover{
  background:#161b22;
}

.avatar{

  width:48px;
  height:48px;

  border-radius:50%;

  background:#30363d;

  display:flex;

  align-items:center;
  justify-content:center;

  font-weight:bold;

  flex-shrink:0;

}

.friend-info{
  min-width:0;
}

.friend-name{
  font-weight:bold;
}

.friend-sub{

  color:#8b949e;

  font-size:13px;

  margin-top:3px;

}

.empty{

  text-align:center;

  color:#8b949e;

  padding:70px 25px;

  line-height:2;

}


/* =========================================================
   CHAT
   ========================================================= */

.chat-header{

  height:64px;

  flex-shrink:0;

  display:flex;

  align-items:center;

  justify-content:space-between;

  background:#161b22;

  border-bottom:
    1px solid #30363d;

  padding:0 10px;

}

.chat-user{

  display:flex;

  align-items:center;

  gap:9px;

}

.chat-user .avatar{

  width:42px;
  height:42px;

}

.chat-info b{
  display:block;
}

.chat-info span{

  color:#3fb950;

  font-size:11px;

}

.chat-actions{

  display:flex;

  gap:8px;

}

.icon{

  border:0;

  background:transparent;

  color:white;

  font-size:20px;

  padding:8px;

}

.messages{

  flex:1;

  overflow:auto;

  padding:15px;

  display:flex;

  flex-direction:column;

  gap:8px;

}

.message{

  max-width:78%;

  padding:10px 13px;

  border-radius:12px;

  line-height:1.5;

  word-break:break-word;

}

.message.me{

  align-self:flex-start;

  background:#1d4ed8;

  border-top-right-radius:3px;

}

.message.other{

  align-self:flex-end;

  background:#21262d;

  border-top-left-radius:3px;

}

.message audio{
  max-width:220px;
}

.composer{

  display:flex;

  gap:7px;

  padding:9px;

  background:#161b22;

  border-top:
    1px solid #30363d;

}

.composer input{
  flex:1;
}

.composer button{

  width:44px;

  border:0;

  border-radius:10px;

  background:#2563eb;

  color:white;

  font-size:18px;

}

#recordBtn.recording{
  background:#f85149;
}


/* =========================================================
   SETTINGS
   ========================================================= */

.settings{

  flex:1;

  overflow:auto;

  padding:20px;

}

.card{

  background:#161b22;

  border:1px solid #30363d;

  border-radius:13px;

  padding:16px;

  margin-bottom:15px;

}

.card h3{

  margin-top:0;

  font-size:16px;

}

.card p{

  color:#8b949e;

  font-size:13px;

  line-height:1.6;

}


/* =========================================================
   CALL
   ========================================================= */

#callScreen{

  position:absolute;

  inset:0;

  z-index:100;

  background:#000;

  display:none;

  flex-direction:column;

}

#callScreen.show{
  display:flex;
}

.call-top{

  position:absolute;

  top:0;
  left:0;
  right:0;

  z-index:5;

  padding:15px;

  background:
    linear-gradient(
      #000c,
      transparent
    );

}

.call-title{
  font-weight:bold;
}

.call-status{

  color:#aaa;

  font-size:12px;

  margin-top:3px;

}

.call-stage{

  position:relative;

  flex:1;

  background:#000;

  overflow:hidden;

}

.remote{

  width:100%;
  height:100%;

  object-fit:cover;

  background:#000;

}

.local{

  position:absolute;

  right:12px;
  top:80px;

  width:115px;
  height:165px;

  object-fit:cover;

  border-radius:12px;

  background:#111;

  z-index:3;

}

.audio-label{

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:22px;

}

.call-controls{

  position:absolute;

  bottom:20px;

  left:0;
  right:0;

  z-index:10;

  display:flex;

  justify-content:center;

  gap:15px;

}

.call-btn{

  width:55px;
  height:55px;

  border-radius:50%;

  border:0;

  background:#303030;

  color:white;

  font-size:20px;

}

.call-btn.hangup{

  background:#f85149;

  width:62px;
  height:62px;

}


/* =========================================================
   INCOMING CALL
   ========================================================= */

#incoming{

  display:none;

  position:absolute;

  inset:0;

  z-index:200;

  background:#080b10f7;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  gap:15px;

}

#incoming.show{
  display:flex;
}

.incoming-avatar{

  width:100px;
  height:100px;

  border-radius:50%;

  background:#30363d;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:35px;

  font-weight:bold;

}

.incoming-name{

  font-size:22px;

  font-weight:bold;

}

.incoming-type{
  color:#8b949e;
}

.incoming-buttons{

  display:flex;

  gap:35px;

  margin-top:20px;

}

.incoming-buttons button{

  width:62px;
  height:62px;

  border-radius:50%;

  border:0;

  font-size:22px;

  color:white;

}

.reject{
  background:#f85149;
}

.accept{
  background:#238636;
}

.hidden{
  display:none!important;
}

</style>

</head>


<body>


<div class="app">


<!-- =====================================================
     LOGIN
     ===================================================== -->

<section
  id="loginScreen"
  class="screen active"
>

  <div class="auth">

    <div class="logo">
      💬
    </div>

    <h1>
      Message App
    </h1>

    <p>
      تواصل مع أصدقائك بسهولة
    </p>

    <div class="tabs">

      <button
        id="loginTab"
        class="active"
      >
        تسجيل دخول
      </button>

      <button
        id="signupTab"
      >
        حساب جديد
      </button>

    </div>

    <div class="field">

      <label>
        اسم المستخدم
      </label>

      <input
        id="username"
        placeholder="اسم المستخدم"
      >

    </div>

    <div class="field">

      <label>
        كلمة المرور
      </label>

      <input
        id="password"
        type="password"
        placeholder="كلمة المرور"
      >

    </div>

    <button
      id="authButton"
      class="primary"
    >
      تسجيل الدخول
    </button>

  </div>

</section>


<!-- =====================================================
     FRIENDS
     ===================================================== -->

<section
  id="friendsScreen"
  class="screen"
>

  <div class="header">

    <h2>
      💬 Message App
    </h2>

    <div class="actions">

      <button
        id="settingsButton"
      >
        ⚙️
      </button>

      <button
        id="logoutButton"
      >
        ⏻
      </button>

    </div>

  </div>

  <div class="account">

    الحساب:

    <b id="currentUserLabel"></b>

  </div>

  <div class="search">

    <input
      id="friendInput"
      placeholder="اكتب اسم المستخدم"
    >

    <button
      id="addFriendButton"
    >
      إضافة
    </button>

  </div>

  <div
    id="friendsList"
    class="list"
  ></div>

</section>


<!-- =====================================================
     SETTINGS
     ===================================================== -->

<section
  id="settingsScreen"
  class="screen"
>

  <div class="header">

    <h2>
      الإعدادات
    </h2>

    <button
      id="settingsBack"
    >
      ✕
    </button>

  </div>

  <div class="settings">

    <div class="card">

      <h3>
        🎙️ أذونات المكالمات
      </h3>

      <p>
        اضغط الزر للسماح للمتصفح باستخدام
        الكاميرا والمايكروفون.
      </p>

      <button
        id="permissionButton"
        class="primary"
      >
        السماح بالكاميرا والمايكروفون
      </button>

    </div>


    <div class="card">

      <h3>
        👤 تعديل الحساب
      </h3>

      <div class="field">

        <label>
          اسم المستخدم
        </label>

        <input
          id="newUsername"
        >

      </div>

      <div class="field">

        <label>
          كلمة المرور الجديدة
        </label>

        <input
          id="newPassword"
          type="password"
        >

      </div>

      <button
        id="saveAccount"
        class="primary"
      >
        حفظ
      </button>

    </div>

  </div>

</section>


<!-- =====================================================
     CHAT
     ===================================================== -->

<section
  id="chatScreen"
  class="screen"
>

  <div class="chat-header">

    <div class="chat-user">

      <button
        id="backChat"
        class="icon"
      >
        ←
      </button>

      <div
        id="chatAvatar"
        class="avatar"
      >
        ?
      </div>

      <div class="chat-info">

        <b id="chatName"></b>

        <span>
          متصل
        </span>

      </div>

    </div>

    <div class="chat-actions">

      <button
        id="videoCall"
        class="icon"
      >
        📹
      </button>

      <button
        id="audioCall"
        class="icon"
      >
        📞
      </button>

    </div>

  </div>


  <div
    id="messages"
    class="messages"
  ></div>


  <div class="composer">

    <input
      id="messageInput"
      placeholder="اكتب رسالة..."
    >

    <button
      id="recordBtn"
    >
      🎙️
    </button>

    <button
      id="sendBtn"
    >
      ➤
    </button>

  </div>

</section>


<!-- =====================================================
     CALL SCREEN
     ===================================================== -->

<div id="callScreen">

  <div class="call-top">

    <div
      id="callTitle"
      class="call-title"
    >
      المكالمة
    </div>

    <div
      id="callStatus"
      class="call-status"
    >
      جاري الاتصال...
    </div>

  </div>


  <div
    id="callStage"
    class="call-stage"
  ></div>


  <div class="call-controls">

    <button
      id="muteBtn"
      class="call-btn"
    >
      🎤
    </button>

    <button
      id="cameraBtn"
      class="call-btn"
    >
      📹
    </button>

    <button
      id="hangupBtn"
      class="call-btn hangup"
    >
      ✕
    </button>

  </div>

</div>


<!-- =====================================================
     INCOMING CALL
     ===================================================== -->

<div id="incoming">

  <div
    id="incomingAvatar"
    class="incoming-avatar"
  >
    ?
  </div>

  <div
    id="incomingName"
    class="incoming-name"
  ></div>

  <div
    id="incomingType"
    class="incoming-type"
  >
    مكالمة واردة...
  </div>

  <div class="incoming-buttons">

    <button
      id="rejectCall"
      class="reject"
    >
      ✕
    </button>

    <button
      id="acceptCall"
      class="accept"
    >
      📞
    </button>

  </div>

</div>


</div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://roqpinipcgwqeqqfpcjm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_BHglXdT_SHbruwO_mluYOQ_DG6twygK";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   STATE
   ========================================================= */

let me = "";

let currentFriend = "";

let friends = [];

let messageChannel = null;

let callChannel = null;

let pc = null;

let localStream = null;

let remoteStream = null;

let activeCallId = "";

let activeCallUser = "";

let incomingCallId = "";

let incomingCaller = "";

let incomingOffer = null;

let incomingVideo = false;

let pendingIce = [];

let muted = false;

let cameraOff = false;

let mediaRecorder = null;

let recordingChunks = [];

let recording = false;


/* =========================================================
   WEBRTC CONFIG
   ========================================================= */

const RTC_CONFIG = {

  iceServers: [

    {
      urls:
        "stun:stun.l.google.com:19302"
    },

    {
      urls:
        "stun:stun1.l.google.com:19302"
    }

  ]

};


/* =========================================================
   HELPERS
   ========================================================= */

function $(id){

  return document.getElementById(id);

}


function showScreen(id){

  document
    .querySelectorAll(".screen")
    .forEach(
      x =>
        x.classList.remove(
          "active"
        )
    );

  $(id)
    .classList
    .add("active");

}


function initials(name){

  return (
    name || "?"
  )
    .trim()
    .charAt(0)
    .toUpperCase();

}


function callId(){

  if(
    window.crypto &&
    crypto.randomUUID
  ){

    return crypto.randomUUID();

  }

  return (
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


function setCallStatus(text){

  $("callStatus")
    .textContent =
    text;

}


function showCall(){

  $("callScreen")
    .classList
    .add("show");

}


function hideCall(){

  $("callScreen")
    .classList
    .remove("show");

}


/* =========================================================
   LOGIN / SIGNUP
   ========================================================= */

let signupMode = false;


$("loginTab").onclick =
  () => {

    signupMode = false;

    $("loginTab")
      .classList
      .add("active");

    $("signupTab")
      .classList
      .remove("active");

    $("authButton")
      .textContent =
      "تسجيل الدخول";

  };


$("signupTab").onclick =
  () => {

    signupMode = true;

    $("signupTab")
      .classList
      .add("active");

    $("loginTab")
      .classList
      .remove("active");

    $("authButton")
      .textContent =
      "إنشاء الحساب";

  };


$("authButton").onclick =
  async () => {

    const username =
      $("username")
        .value
        .trim();

    const password =
      $("password")
        .value
        .trim();


    if(
      !username ||
      !password
    ){

      alert(
        "اكتب اسم المستخدم وكلمة المرور"
      );

      return;

    }


    const button =
      $("authButton");


    button.disabled = true;


    try{

      if(signupMode){

        const {
          data:exists,
          error:checkError
        } =
          await db
            .from("profiles")
            .select("username")
            .eq(
              "username",
              username
            )
            .maybeSingle();


        if(checkError)
          throw checkError;


        if(exists){

          alert(
            "اسم المستخدم موجود بالفعل."
          );

          return;

        }


        const {error} =
          await db
            .from("profiles")
            .insert([{

              username:
                username,

              password:
                password

            }]);


        if(error)
          throw error;


        alert(
          "تم إنشاء الحساب."
        );

      }


      const {
        data,
        error
      } =
        await db
          .from("profiles")
          .select("*")
          .eq(
            "username",
            username
          )
          .eq(
            "password",
            password
          )
          .maybeSingle();


      if(error)
        throw error;


      if(!data){

        alert(
          "اسم المستخدم أو كلمة المرور غير صحيحة."
        );

        return;

      }


      await login(
        username
      );


    }catch(error){

      console.error(error);

      alert(
        "حدث خطأ:\n" +
        error.message
      );


    }finally{

      button.disabled = false;

    }

  };


/* =========================================================
   LOGIN
   ========================================================= */

async function login(username){

  me =
    username;


  localStorage.setItem(
    "message_app_user",
    username
  );


  $("currentUserLabel")
    .textContent =
    username;


  await loadFriends();


  subscribeMessages();

  subscribeCalls();


  showScreen(
    "friendsScreen"
  );

}


/* =========================================================
   AUTO LOGIN
   ========================================================= */

window.addEventListener(
  "DOMContentLoaded",
  async () => {

    const saved =
      localStorage.getItem(
        "message_app_user"
      );


    if(saved){

      me =
        saved;


      $("currentUserLabel")
        .textContent =
        saved;


      await loadFriends();


      subscribeMessages();

      subscribeCalls();


      showScreen(
        "friendsScreen"
      );

    }

  }
);


/* =========================================================
   LOGOUT
   ========================================================= */

$("logoutButton").onclick =
  async () => {

    await endCall(true);


    if(messageChannel){

      try{

        await db.removeChannel(
          messageChannel
        );

      }catch(e){}


      messageChannel =
        null;

    }


    if(callChannel){

      try{

        await db.removeChannel(
          callChannel
        );

      }catch(e){}


      callChannel =
        null;

    }


    localStorage.removeItem(
      "message_app_user"
    );


    me = "";

    currentFriend = "";

    friends = [];


    showScreen(
      "loginScreen"
    );

  };


/* =========================================================
   FRIENDS
   ========================================================= */

$("addFriendButton").onclick =
  async () => {

    const name =
      $("friendInput")
        .value
        .trim();


    if(!name){

      alert(
        "اكتب اسم المستخدم."
      );

      return;

    }


    if(name === me){

      alert(
        "لا يمكنك إضافة نفسك."
      );

      return;

    }


    if(
      !friends.includes(name)
    ){

      friends.push(name);

    }


    $("friendInput")
      .value = "";


    renderFriends();


    openChat(name);

  };


async function loadFriends(){

  if(!me)
    return;


  const {
    data,
    error
  } =
    await db
      .from("message")
      .select(
        "sender,receiver"
      )
      .or(
        `sender.eq.${me},receiver.eq.${me}`
      );


  if(error){

    console.error(error);

    return;

  }


  friends = [];


  (
    data || []
  ).forEach(
    message => {

      const other =
        message.sender === me
          ? message.receiver
          : message.sender;


      if(
        other &&
        other !== me &&
        !friends.includes(other)
      ){

        friends.push(other);

      }

    }
  );


  renderFriends();

}


function renderFriends(){

  const list =
    $("friendsList");


  list.innerHTML = "";


  if(!friends.length){

    list.innerHTML = `

      <div class="empty">

        لا توجد محادثات حالياً.

        <br>

        اكتب اسم مستخدم بالأعلى
        لبدء محادثة.

      </div>

    `;

    return;

  }


  friends.forEach(
    name => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "friend";


      row.innerHTML = `

        <div class="avatar">

          ${initials(name)}

        </div>

        <div class="friend-info">

          <div class="friend-name">

            ${escapeHtml(name)}

          </div>

          <div class="friend-sub">

            اضغط لفتح المحادثة

          </div>

        </div>

      `;


      row.onclick =
        () =>
          openChat(name);


      list.appendChild(row);

    }
  );

}


function escapeHtml(value){

  return String(
    value || ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

async function startRecording(){

  try{

    if(!currentFriend){

      alert(
        "افتح محادثة أولاً."
      );

      return;

    }


    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:true
        });


    recordingChunks = [];


    mediaRecorder =
      new MediaRecorder(
        stream
      );


    mediaRecorder
      .ondataavailable =
      event => {

        if(event.data.size){

          recordingChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      async () => {

        const blob =
          new Blob(
            recordingChunks,
            {
              type:
                "audio/webm"
            }
          );


        const reader =
          new FileReader();


        reader.onloadend =
          async () => {

            const {
              error
            } =
              await db
                .from("message")
                .insert([{

                  sender:
                    me,

                  receiver:
                    currentFriend,

                  text:
                    "🎙️ رسالة صوتية",

                  audio_url:
                    reader.result

                }]);


            if(error){

              console.error(
                error
              );

              alert(
                "تعذر إرسال الرسالة الصوتية."
              );

            }

          };


        reader.readAsDataURL(
          blob
        );


        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

      };


    mediaRecorder.start();


    recording =
      true;


    $("recordBtn")
      .classList
      .add(
        "recording"
      );

  }catch(error){

    console.error(error);

    alert(
      "تعذر الوصول إلى المايكروفون:\n" +
      error.message
    );

  }

}


function stopRecording(){

  if(
    mediaRecorder &&
    mediaRecorder.state !==
      "inactive"
  ){

    mediaRecorder.stop();

  }


  recording =
    false;


  $("recordBtn")
    .classList
    .remove(
      "recording"
    );

}

/* =========================================================
   CALL SIGNALING
   ========================================================= */

async function sendCallSignal(
  target,
  type,
  data,
  room = activeCallId
){

  if(!target || !me || !room){
    return;
  }

  const payload = {
    ...data,
    from: me,
    to: target,
    callId: room
  };

  const { error } =
    await db
      .from("call_signals")
      .insert({
        room_id: room,
        sender_id: me,
        signal_type: type,
        payload: payload
      });

  if(error){
    console.error(
      "CALL SIGNAL ERROR:",
      error
    );

    throw error;
  }

}


/* =========================================================
   SUBSCRIBE CALL SIGNALS
   ========================================================= */

function subscribeCalls(){

  if(!me)
    return;


  if(callChannel){

    try{

      db.removeChannel(
        callChannel
      );

    }catch(e){}


    callChannel =
      null;

  }


  callChannel =
    db
      .channel(
        "call-signals-" +
        me +
        "-" +
        Date.now()
      )

      .on(
        "postgres_changes",
        {
          event:
            "INSERT",
          schema:
            "public",
          table:
            "call_signals"
        },

        async payload => {

          try{

            const row =
              payload.new;


            if(!row)
              return;


            const signal =
              row.payload ||
              {};


            if(
              signal.to !== me
            ){

              return;

            }


            if(
              row.sender_id === me
            ){

              return;

            }


            await handleCallSignal(
              row
            );


          }catch(error){

            console.error(
              "Signal handling error:",
              error
            );

          }

        }

      )

      .subscribe(
        status => {

          console.log(
            "Call signaling:",
            status
          );

        }
      );

}


/* =========================================================
   HANDLE CALL SIGNAL
   ========================================================= */

async function handleCallSignal(row){

  const type =
    row.signal_type;


  const data =
    row.payload || {};


  switch(type){

    case "call":

      await receiveIncomingCall(
        data
      );

      break;


    case "answer":

      await receiveAnswer(
        data
      );

      break;


    case "ice":

      await receiveIce(
        data
      );

      break;


    case "hangup":

      await receiveHangup(
        data
      );

      break;


    case "declined":

      await receiveDeclined(
        data
      );

      break;


    case "busy":

      await receiveBusy(
        data
      );

      break;

  }

}

async function receiveAnswer(data){

  if(!pc){
    return;
  }

  if(!activeCallId){
    return;
  }

  if(data.callId !== activeCallId){
    return;
  }

  if(!data.answer){
    return;
  }

  try{

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        data.answer
      )
    );

    console.log(
      "Remote answer set successfully"
    );

    await flushIce();

    setCallStatus(
      "متصل الآن"
    );

  }catch(error){

      error
    );

    setCallStatus(
      "فشل استقبال الرد"
    );

  }

}


/* =========================================================
   RECEIVE ICE
   ========================================================= */

async function receiveIce(data){

  if(!data){
    return;
  }

  if(!data.candidate){
    return;
  }

  const signalCallId =
    data.callId;

  if(!signalCallId){
    return;
  }

  /*
    لا نقبل ICE من مكالمة قديمة
  */

  if(
    signalCallId !== activeCallId &&
    signalCallId !== incomingCallId
  ){

    console.log(
      "Ignoring ICE from another call:",
      signalCallId
    );

    return;

  }

  /*
    إذا لم يتم إنشاء PeerConnection
    بعد، خزنه مؤقتاً.
  */

  if(!pc){

    pendingIce.push(
      data.candidate
    );

    console.log(
      "ICE queued: no PeerConnection"
    );

    return;

  }

  /*
    إذا لم يصل Remote Description
    بعد، خزنه مؤقتاً.
  */

  if(
    !pc.remoteDescription ||
    !pc.remoteDescription.type
  ){

    pendingIce.push(
      data.candidate
    );

    console.log(
      "ICE queued: waiting for remote description"
    );

    return;

  }

  try{

    await pc.addIceCandidate(
      new RTCIceCandidate(
        data.candidate
      )
    );

    console.log(
      "ICE candidate added"
    );

  }catch(error){

    console.error(
      "ICE add error:",
      error
    );

  }

}

/* =========================================================
   PEER CONNECTION
   ========================================================= */

function createPeerConnection(
  friend,
  id
){

  if(pc){

    try{

      pc.close();

    }catch(e){}

  }


  pc =
    new RTCPeerConnection(
      RTC_CONFIG
    );


  remoteStream =
    new MediaStream();


  /*
    استقبال فيديو وصوت الطرف الآخر
  */

  pc.ontrack =
    event => {

      console.log(
        "REMOTE TRACK:",
        event.track.kind
      );


      if(
        event.streams &&
        event.streams[0]
      ){

        event.streams[0]
          .getTracks()
          .forEach(
            track => {

              if(
                !remoteStream
                  .getTracks()
                  .includes(track)
              ){

                remoteStream.addTrack(
                  track
                );

              }

            }
          );

      }else{

        if(
          !remoteStream
            .getTracks()
            .includes(
              event.track
            )
        ){

          remoteStream.addTrack(
            event.track
          );

        }

      }


      const remote =
        document.querySelector(
          ".remote"
        );


      if(remote){

        remote.srcObject =
          remoteStream;


        remote.play()
          .catch(
            error => {

              console.warn(
                "Remote play:",
                error
              );

            }
          );

      }

    };


  /*
    إرسال ICE
  */

  pc.onicecandidate =
    async event => {

      if(!event.candidate){
        return;
      }

      try{

        const candidate =
          event.candidate.toJSON
            ? event.candidate.toJSON()
            : {
                candidate:
                  event.candidate.candidate,

                sdpMid:
                  event.candidate.sdpMid,

                sdpMLineIndex:
                  event.candidate.sdpMLineIndex,

                usernameFragment:
                  event.candidate.usernameFragment
              };

        await sendCallSignal(
          friend,
          "ice",
          {
            callId:
              id,

            candidate:
              candidate
          },
          id
        );

      }catch(error){

        console.error(
          "ICE send error:",
          error
        );

      }

    };


  /*
    حالة WebRTC
  */

  pc.onconnectionstatechange =
    () => {

      if(!pc)
        return;


      const state =
        pc.connectionState;


      console.log(
        "WebRTC state:",
        state
      );


      if(
        state ===
        "connected"
      ){

        setCallStatus(
          "متصل الآن"
        );

      }

      else if(
        state ===
        "connecting"
      ){

        setCallStatus(
          "جاري الاتصال..."
        );

      }

      else if(
        state ===
        "disconnected"
      ){

        setCallStatus(
          "الاتصال انقطع..."
        );

      }

      else if(
        state ===
        "failed"
      ){

        setCallStatus(
          "فشل الاتصال"
        );

      }

      else if(
        state ===
        "closed"
      ){

        setCallStatus(
          "انتهت المكالمة"
        );

      }

    };


  /*
    إضافة صوت وفيديو المستخدم
  */

  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track => {

          pc.addTrack(
            track,
            localStream
          );

        }
      );

  }

}


/* =========================================================
   FLUSH ICE
   ========================================================= */

async function flushIce(){

  if(!pc){
    return;
  }

  if(
    !pc.remoteDescription ||
    !pc.remoteDescription.type
  ){
    return;
  }

  if(!pendingIce.length){
    return;
  }

  const list =
    [...pendingIce];

  pendingIce = [];

  console.log(
    "Flushing ICE:",
    list.length
  );

  for(
    const candidate of list
  ){

    try{

      await pc.addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

      console.log(
        "Queued ICE added"
      );

    }catch(error){

      console.warn(
        "Queued ICE error:",
        error
      );

    }

  }

}


/* =========================================================
   CALL UI
   ========================================================= */

function setupCallVideos(
  stream,
  video
){

  const stage =
    $("callStage");


  stage.innerHTML =
    "";


  /*
    الفيديو الكبير:
    الطرف الآخر
  */

  const remote =
    document.createElement(
      "video"
    );


  remote.className =
    "remote";


  remote.autoplay =
    true;


  remote.playsInline =
    true;


  remote.setAttribute(
    "playsinline",
    ""
  );


  /*
    الفيديو الصغير:
    المستخدم نفسه
  */

  const local =
    document.createElement(
      "video"
    );


  local.className =
    "local";


  local.autoplay =
    true;


  local.playsInline =
    true;


  local.muted =
    true;


  local.setAttribute(
    "playsinline",
    ""
  );


  local.srcObject =
    stream;


  /*
    صوت فقط
  */

  if(!video){

    local.style.display =
      "none";


    const label =
      document.createElement(
        "div"
      );


    label.className =
      "audio-label";


    label.textContent =
      "📞 مكالمة صوتية";


    stage.appendChild(
      label
    );

  }


  stage.appendChild(
    remote
  );


  stage.appendChild(
    local
  );


  /*
    محاولة تشغيل الفيديو المحلي
  */

  local.play()
    .catch(
      () => {}
    );

}


/* =========================================================
   MUTE
   ========================================================= */

$("muteBtn").onclick =
  () => {

    if(!localStream)
      return;


    const tracks =
      localStream
        .getAudioTracks();


    if(!tracks.length)
      return;


    muted =
      !muted;


    tracks.forEach(
      track => {

        track.enabled =
          !muted;

      }
    );


    $("muteBtn")
      .textContent =
      muted
        ? "🔇"
        : "🎤";

  };


/* =========================================================
   CAMERA
   ========================================================= */

$("cameraBtn").onclick =
  () => {

    if(!localStream)
      return;


    const tracks =
      localStream
        .getVideoTracks();


    if(!tracks.length)
      return;


    cameraOff =
      !cameraOff;


    tracks.forEach(
      track => {

        track.enabled =
          !cameraOff;

      }
    );


    $("cameraBtn")
      .textContent =
      cameraOff
        ? "🚫"
        : "📹";

  };


/* =========================================================
   HANGUP
   ========================================================= */

$("hangupBtn").onclick =
  () =>
    endCall(true);


async function endCall(
  sendSignalToOther
){

  const user =
    activeCallUser;


  const id =
    activeCallId;


  /*
    إخبار الطرف الآخر
  */

  if(
    sendSignalToOther &&
    user &&
    id
  ){

    try{

      await sendCallSignal(
        user,
        "hangup",
        {
          callId:
            id
        },
        id
      );

    }catch(error){

      console.error(
        "Hangup signal error:",
        error
      );

    }

  }


  /*
    إيقاف الكاميرا والمايك
  */

  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    localStream =
      null;

  }


  /*
    إغلاق WebRTC
  */

  if(pc){

    try{

      pc.ontrack =
        null;

      pc.onicecandidate =
        null;

      pc.onconnectionstatechange =
        null;

      pc.close();

    }catch(e){}


    pc =
      null;

  }


  remoteStream =
    null;


  pendingIce =
    [];


  activeCallUser =
    "";


  activeCallId =
    "";


  muted =
    false;


  cameraOff =
    false;


  $("callStage")
    .innerHTML =
    "";


  hideCall();

}


/* =========================================================
   PAGE CLOSE
   ========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    if(localStream){

      localStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    if(pc){

      try{

        pc.close();

      }catch(e){}

    }

  }
);


/* =========================================================
   ERROR DEBUG
   ========================================================= */

window.addEventListener(
  "unhandledrejection",
  event => {

    console.error(
      "Unhandled:",
      event.reason
    );

  }
);


window.onerror =
  (
    message,
    source,
    line,
    column,
    error
  ) => {

    console.error(
      message,
      source,
      line,
      column,
      error
    );

    return false;

  };
